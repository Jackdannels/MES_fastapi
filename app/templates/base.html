<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}MES中控{% endblock %}</title>
  <link rel="stylesheet" href="{{ request.url_for('static', path='app.css') }}">
</head>
<body
  data-label-source-external="外部委托"
  data-label-source-internal="内部新增"
  data-label-status-accepted="已受理"
  data-label-status-waiting="待排程"
  data-label-status-scheduled="已排程"
  data-label-status-retention="&#26242;&#23384;&#38388;&#25490;&#25918;"
  data-label-status-running="执行中"
  data-label-sample-received="已接收"
  data-label-sample-testing="试验中"
  data-label-sample-stored="已入库"
  data-label-sample-disposed="已处置"
  data-label-data-streaming="采集中"
  data-label-data-gap="有缺口"
  data-label-data-complete="已完成"
  data-label-device-idle="可用"
  data-label-device-in-use="使用中"
  data-label-device-maintenance="维护/校准"
  data-label-edit="编辑"
  data-label-detail="明细"
  data-label-view="查看详情"
  data-label-alert-gap="检测到数据缺口"
  data-label-alert-none="无预警"
  data-label-maintenance-prefix="校准中"
  data-label-maintenance-suffix="台"
  data-label-gap-recorded="最近缺口已记录"
  data-label-gap-none="暂无缺口"
  data-label-conflict-overlap="时间重叠"
  data-label-conflict-delay="延迟"
  data-label-conflict-reschedule="调整时间"
  data-label-unassigned-device="设备待定"
  data-label-intake-location="室外接驳区"
  data-label-retention-location="恒温恒湿间（暂存间）"
  data-label-unpacking-location="拆箱操作间"
  data-label-task-name-required="请填写任务名称后再提交。"
  data-label-schedule-select-required="请先选择任务和实验室。"
  data-label-schedule-custom-time-required="自定义时间需要填写开始与结束时间。"
  data-label-schedule-time-invalid="排程时间不合法，请检查日期与时间。"
  data-label-schedule-conflict-template="排程冲突：{device} 在 {start}-{end} 已安排 {task}。"
  data-label-schedule-task-conflict-template="任务冲突：{task} 已在 {start}-{end} 排程。"
  data-label-schedule-suggest-prefix="建议："
  data-label-schedule-suggest-none="未来7天暂无可用时段"
  data-label-slot-morning="上午（08:00-11:30）"
  data-label-slot-afternoon="下午（13:30-17:00）"
  data-testing-random="1"
  data-random-task-year="2026"
>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        七二四新火工区信息化中控管理系统
        <span>实验室中控管理</span>
      </div>
      <nav class="nav">
        <a class="{% if page == 'dashboard' %}active{% endif %}" href="/">中控总览</a>
        <a class="{% if page == 'tasks' %}active{% endif %}" href="/tasks">任务受理</a>
        <a class="{% if page == 'schedule' %}active{% endif %}" href="/schedule">排程看板</a>
        <a class="{% if page == 'samples' %}active{% endif %}" href="/samples">样品管理</a>
        <a class="{% if page == 'process' %}active{% endif %}" href="/process">试验过程</a>
        <a class="{% if page == 'devices' %}active{% endif %}" href="/devices">设备资源</a>
        <a class="{% if page == 'data' %}active{% endif %}" href="/data">试验数据</a>
        <a class="{% if page == 'system' %}active{% endif %}" href="/system">系统信息</a>
      </nav>
      <div class="sidebar-footer">
        已连接：Modbus
        <div class="badge-row">
          <span class="badge">自动采集</span>
          <span class="badge">固定报告</span>
        </div>
      </div>
    </aside>
    <main class="main">
      <header class="page-header">
        <div>
          <div class="eyebrow">中控中心</div>
          <h1>{{ title }}</h1>
          <p class="subtitle">{{ subtitle }}</p>
        </div>
        <div class="header-actions">
          {% block actions %}
            <a class="action-btn" href="/tasks#task-modal" data-modal-open="task-modal">新建任务</a>
          <a class="action-btn secondary" href="/schedule">查看排程</a>
          {% endblock %}
        </div>
      </header>
      {% block content %}{% endblock %}
    </main>
  </div>
  <script type="module" src="{{ request.url_for('static', path='js/main.js') }}"></script>
</body>
</html>
