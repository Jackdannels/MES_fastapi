<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>排程优先级 · 三种提醒方案</title>
  <style>
    :root{color-scheme:dark;--bg:#091114;--panel:#101b20;--field:#131f25;--line:#2d424b;--text:#e7f0f3;--muted:#9db1ba;--accent:#61d7c7;--high:#ffa99c;--high-bg:#362624;--mid:#f2cd7e;--mid-bg:#302c21;--low:#9ac8fa;--low-bg:#202e3e;font-family:"Microsoft YaHei","PingFang SC",sans-serif;font-size:14px}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);line-height:1.6}button,input{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button{transition:background .16s,border-color .16s}button:hover{border-color:var(--accent)}[hidden]{display:none!important}
    main{max-width:1540px;margin:auto;padding:30px 36px 40px}.topline{display:flex;justify-content:space-between;align-items:center;gap:16px;color:var(--muted);font-size:12px;letter-spacing:1px}.brand{display:flex;align-items:center;gap:10px}.mark{width:22px;height:22px;border:1px solid var(--accent);display:grid;place-items:center;color:var(--accent)}.prototype{border:1px solid var(--line);padding:4px 10px;border-radius:4px;letter-spacing:0}
    header{padding:30px 0 22px}h1{margin:0 0 10px;font-size:30px;letter-spacing:1px;font-weight:600}p{margin:0;color:var(--muted)}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:18px;border-block:1px solid var(--line);padding:16px 0;margin-bottom:24px}.scenarios{display:flex;gap:6px;flex-wrap:wrap}.scenario{border:1px solid var(--line);border-radius:5px;background:transparent;min-height:40px;padding:7px 14px}.scenario[aria-pressed="true"]{color:var(--accent);background:#17342f;border-color:#478d81}.legend{display:flex;gap:18px;color:var(--muted);font-size:12px;flex-wrap:wrap}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--priority);margin-right:6px}.high{--priority:var(--high);--tint:var(--high-bg)}.mid{--priority:var(--mid);--tint:var(--mid-bg)}.low{--priority:var(--low);--tint:var(--low-bg)}
    .options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.option{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel);display:flex;flex-direction:column}.option.recommended{border-color:#447f78}.option-head{padding:20px 22px;border-bottom:1px solid var(--line)}.eyebrow{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);letter-spacing:1.5px}.recommend{color:var(--accent);letter-spacing:0}h2{font-size:21px;margin:7px 0} .option-head p{font-size:13px;min-height:42px}.demo{padding:20px 20px 16px;flex:1;background:linear-gradient(145deg,#0d181d,#101a20)}.demo-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}h3{font-size:16px;margin:0}.demo-head span{font-size:11px;color:var(--muted)}.field-label{font-size:12px;color:var(--muted);display:block;margin-bottom:7px}.trigger{width:100%;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--field);border-radius:4px;min-height:44px;padding:8px 11px;text-align:left}.chosen-code{flex:1;font-family:Consolas,monospace;font-size:13px}.chevron{width:7px;height:7px;border:solid var(--muted);border-width:0 1px 1px 0;transform:rotate(45deg);margin:0 2px 4px 5px}.badge{display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;color:var(--priority);background:var(--tint);border:1px solid color-mix(in srgb,var(--priority) 28%,transparent);padding:1px 7px;border-radius:4px;font-size:11px;font-weight:500;letter-spacing:0}.menu{margin-top:6px;border:1px solid #38505a;border-radius:5px;overflow:hidden;background:#142128;box-shadow:0 10px 24px #0003}.menu-top{padding:9px 11px;border-bottom:1px solid var(--line);font-size:11px;color:var(--muted);display:flex;justify-content:space-between}.items{height:292px;overflow:auto;padding:5px}.task{display:flex;align-items:center;width:100%;gap:10px;border:1px solid transparent;border-radius:4px;background:transparent;text-align:left;padding:10px;min-height:65px;position:relative}.task+.task{margin-top:4px}.task:hover{background:#243841}.task[aria-pressed="true"]{outline:1px solid #7a9b9b;outline-offset:-2px}.task-info{flex:1;min-width:0}.code{font-family:Consolas,monospace;font-size:13px;display:block;letter-spacing:.15px}.sub{font-size:11px;color:var(--muted);display:block;margin-top:3px}.check{font-size:12px;color:var(--accent);width:12px}.option-b .task{background:var(--tint);border-left:3px solid var(--priority)}.option-b .task:hover{filter:brightness(1.15)}.option-c .group-title{color:var(--priority);background:var(--tint);font-size:11px;padding:5px 9px;display:flex;justify-content:space-between;margin-top:5px;border-left:2px solid var(--priority)}.option-c .group-title:first-child{margin-top:0}.option-c .task{min-height:54px;padding-block:6px}.option-c .sub{margin-top:1px}.empty{color:var(--muted);padding:36px 12px;text-align:center;font-size:13px}.hint{margin:14px 0 16px;padding:10px 11px;border:1px solid #41534f;background:#172c2a;color:#bad6d1;border-radius:4px;font-size:12px;min-height:60px}.hint.warn{border-color:#695738;background:#2b281f;color:var(--mid)}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.readonly{border:1px solid var(--line);border-radius:4px;padding:8px 10px;font-size:12px;background:var(--field);color:#b7c9d0;min-height:39px}.actions{display:flex;gap:10px;margin-top:16px}.primary,.reset{min-height:39px;border-radius:4px;padding:7px 14px;border:1px solid #367f76;background:#163833;color:var(--accent)}.reset{border-color:var(--line);background:transparent;color:var(--muted)}button:disabled{opacity:.45;cursor:not-allowed}.outcome{font-size:12px;min-height:40px;color:var(--accent);padding-top:10px}.option-foot{padding:16px 20px;background:#131f25;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}.option-foot strong{color:var(--text);font-weight:500}.choose{width:100%;margin-top:13px;border:1px solid var(--line);background:transparent;border-radius:4px;min-height:40px}.choose[aria-pressed="true"]{background:#21443b;border-color:var(--accent);color:var(--accent)}.notes{display:flex;justify-content:space-between;gap:24px;margin-top:22px;color:var(--muted);font-size:12px}.notes p{max-width:820px}.decision{color:var(--accent);min-width:180px;text-align:right}.key{color:var(--text)}
    @media(min-width:1500px){.items{height:304px}.task{min-height:68px}}@media(max-width:1100px){main{padding:24px}.options{gap:12px}.demo{padding:16px 12px}.option-head{padding:18px 14px}.badge{padding-inline:4px}.task{padding-inline:7px;gap:6px}}@media(max-width:850px){.options{grid-template-columns:1fr}.toolbar{align-items:flex-start;flex-direction:column}.option-head p{min-height:0}.items{height:auto;max-height:340px}.notes{flex-direction:column}.decision{text-align:left}.topline{align-items:flex-start}h1{font-size:25px}main{padding:20px 16px}.prototype{white-space:nowrap}.scenarios{gap:8px}.scenario{min-height:44px}.primary,.reset,.choose{min-height:44px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <main>
    <div class="topline"><div class="brand"><span class="mark" aria-hidden="true">M</span> MES / 排程看板</div><span class="prototype">交互原型 · 模拟数据</span></div>
    <header><h1>让任务优先级，一眼可见。</h1><p>保留现有深色排程界面，对比三种提醒强度。点击任务，体验选中后的提示。</p></header>
    <section class="toolbar" aria-label="预览场景">
      <div class="scenarios"><button class="scenario" data-scene="mixed" aria-pressed="true">不同优先级并存</button><button class="scenario" data-scene="same" aria-pressed="false">全部同一优先级</button><button class="scenario" data-scene="empty" aria-pressed="false">暂无任务</button></div>
      <div class="legend" aria-label="优先级图例"><span class="high"><i class="dot"></i>高 · 珊瑚橙</span><span class="mid"><i class="dot"></i>中 · 琥珀黄</span><span class="low"><i class="dot"></i>低 · 雾蓝</span></div>
    </section>
    <section class="options" aria-label="三种设计方案"></section>
    <footer class="notes"><p><span class="key">设计边界</span>　颜色仅表示任务优先级，不代替运行状态或异常告警。A / B 保持原任务顺序；C 仅按优先级分组展示，不修改实际排程顺序。所有操作均为演示，不连接业务接口。</p><div class="decision" role="status">尚未标记偏好方案</div></footer>
  </main>
  <script>
    const tasks = [
      {code:'SYLU-20260920-001',priority:'中',type:'高低温试验',samples:8},
      {code:'SYLU-20260920-002',priority:'高',type:'振动试验',samples:12},
      {code:'SYLU-20260920-003',priority:'低',type:'湿热试验',samples:6},
      {code:'SYLU-20260920-004',priority:'高',type:'冲击试验',samples:4},
    ];
    const names={高:'high',中:'mid',低:'low'};
    const designs=[
      {id:'a',title:'轻量标签',description:'仅为任务增加优先级标签，界面安静，保持原有操作习惯。',fit:'希望最小改动，日常提醒不过度。',cost:'提醒较轻，需阅读右侧标签。'},
      {id:'b',title:'色条浅底',description:'左侧色条搭配低饱和底色，让不同优先级在列表中更易辨认。',fit:'混合优先级较常见，需要快速扫视。',cost:'提醒更明显，仍保留原任务顺序。'},
      {id:'c',title:'优先级分组',description:'按高、中、低分区展示，先看优先级，再选择对应任务。',fit:'待排任务较多，经常需要优先处理高优任务。',cost:'列表结构变化较大，可能增加滚动。'},
    ];
    let scene='mixed';const selected={a:tasks[0].code,b:tasks[0].code,c:tasks[0].code};
    const badge=t=>`<span class="badge ${names[t.priority]}">${t.priority}优先级</span>`;
    const getTasks=()=>scene==='empty'?[]:tasks.map(t=>({...t,priority:scene==='same'?'中':t.priority}));
    for(const d of designs){
      const card=document.createElement('article');card.className=`option option-${d.id} ${d.id==='b'?'recommended':''}`;card.dataset.id=d.id;
      card.innerHTML=`<div class="option-head"><div class="eyebrow"><span>方案 ${d.id.toUpperCase()} / 0${designs.indexOf(d)+1}</span>${d.id==='b'?'<span class="recommend">推荐 · 提醒与克制兼顾</span>':''}</div><h2>${d.title}</h2><p>${d.description}</p></div><div class="demo"><div class="demo-head"><h3>手动排程</h3><span>局部效果预览</span></div><span class="field-label" id="label-${d.id}">任务编号</span><button class="trigger" aria-labelledby="label-${d.id} chosen-${d.id}" aria-expanded="true" aria-controls="menu-${d.id}"><span class="chosen-code" id="chosen-${d.id}"></span><span class="selection-badge"></span><i class="chevron" aria-hidden="true"></i></button><div class="menu" id="menu-${d.id}"><div class="menu-top"><span>${d.id==='c'?'按优先级分组 · 组内保持原序':'可排程任务 · 保持原序'}</span><span class="count"></span></div><div class="items" role="group" aria-label="方案${d.id.toUpperCase()}可选任务"></div></div><div class="hint" role="status"></div><div class="fields"><div><span class="field-label">实验类型</span><div class="readonly experiment"></div></div><div><span class="field-label">排程日期 · 演示</span><div class="readonly">2026-09-21</div></div></div><div class="actions"><button class="primary">确认排程（演示）</button><button class="reset">重置选择</button></div><div class="outcome" role="status"></div></div><div class="option-foot"><div><strong>适合：</strong>${d.fit}</div><div>${d.cost}</div><button class="choose" aria-pressed="false">偏好方案 ${d.id.toUpperCase()}</button></div>`;
      document.querySelector('.options').append(card);
      card.querySelector('.trigger').addEventListener('click',()=>{const menu=card.querySelector('.menu');menu.hidden=!menu.hidden;card.querySelector('.trigger').setAttribute('aria-expanded',String(!menu.hidden));});
      card.querySelector('.menu').addEventListener('keydown',event=>{
        if(event.key==='Escape'){card.querySelector('.menu').hidden=true;card.querySelector('.trigger').setAttribute('aria-expanded','false');card.querySelector('.trigger').focus();}
        if(['ArrowDown','ArrowUp','Home','End'].includes(event.key)){event.preventDefault();const buttons=[...card.querySelectorAll('.task')];const index=buttons.indexOf(document.activeElement);const next=event.key==='Home'?0:event.key==='End'?buttons.length-1:(index+(event.key==='ArrowDown'?1:-1)+buttons.length)%buttons.length;buttons[next]?.focus();}
      });
      card.querySelector('.primary').addEventListener('click',()=>{card.querySelector('.outcome').textContent='演示完成：已展示排程反馈，未写入实际排程。';});
      card.querySelector('.reset').addEventListener('click',()=>{selected[d.id]='';render(card);});
      card.querySelector('.choose').addEventListener('click',()=>{document.querySelectorAll('.choose').forEach(b=>b.setAttribute('aria-pressed','false'));card.querySelector('.choose').setAttribute('aria-pressed','true');document.querySelector('.decision').textContent=`已标记偏好：${d.id.toUpperCase()} · ${d.title}（仅本页）`;});
    }
    function render(card){
      const id=card.dataset.id,list=getTasks(),current=list.find(t=>t.code===selected[id]),items=card.querySelector('.items');items.replaceChildren();
      const row=t=>{const button=document.createElement('button');button.className=`task ${names[t.priority]}`;button.setAttribute('aria-pressed',String(current?.code===t.code));button.innerHTML=`<span class="task-info"><span class="code">${t.code}</span><span class="sub">${t.type} · ${t.samples} 件样品</span></span>${badge(t)}<span class="check" aria-hidden="true">${current?.code===t.code?'✓':''}</span>`;button.addEventListener('click',()=>{selected[id]=t.code;render(card);const target=[...card.querySelectorAll('.task')].find(b=>b.textContent.includes(t.code));target?.focus({preventScroll:true});});items.append(button);};
      if(!list.length){items.innerHTML='<div class="empty">暂无已接收任务<br>有可排程任务后将在此显示</div>';}
      else if(id==='c'){for(const priority of ['高','中','低']){const group=list.filter(t=>t.priority===priority);if(!group.length)continue;const heading=document.createElement('div');heading.className=`group-title ${names[priority]}`;heading.innerHTML=`<span>${priority}优先级</span><span>${group.length} 项</span>`;items.append(heading);group.forEach(row);}}
      else list.forEach(row);
      card.querySelector('.chosen-code').textContent=current?.code||(list.length?'请选择已接收任务':'暂无已接收任务');card.querySelector('.selection-badge').innerHTML=current?badge(current):'';card.querySelector('.count').textContent=`${list.length} 项`;card.querySelector('.experiment').textContent=current?.type||'请先选择任务';
      const mixed=new Set(list.map(t=>t.priority)).size>1;const higher=current?list.filter(t=>['高','中','低'].indexOf(t.priority)<['高','中','低'].indexOf(current.priority)).length:0;
      const hint=card.querySelector('.hint');hint.classList.toggle('warn',mixed&&higher>0);hint.textContent=!list.length?'暂无可排程任务，暂不显示优先级提醒。':!mixed?'当前任务均为中优先级，无需额外提醒。':higher?`当前选择${current.priority}优先级，列表中还有 ${higher} 项更高优先级任务待排，请留意安排。`:current?'当前已选择高优先级任务，可继续安排实验。':'当前存在不同优先级任务，请结合实际需要安排。';
      card.querySelector('.primary').disabled=!current;card.querySelector('.reset').disabled=!current;card.querySelector('.outcome').textContent='';
    }
    document.querySelectorAll('.scenario').forEach(button=>button.addEventListener('click',()=>{scene=button.dataset.scene;document.querySelectorAll('.scenario').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));document.querySelectorAll('.option').forEach(card=>{selected[card.dataset.id]=tasks[0].code;card.querySelector('.menu').hidden=false;card.querySelector('.trigger').setAttribute('aria-expanded','true');render(card);});}));
    document.querySelectorAll('.option').forEach(render);
  </script>
</body>
</html>
