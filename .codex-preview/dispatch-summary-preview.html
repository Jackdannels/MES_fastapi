<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>接驳出库摘要卡方案预览</title>
  <style>
    :root {
      color-scheme: dark;
      --bg-deep: #071112;
      --bg-card: #0b1519;
      --bg-card-raised: #101b22;
      --bg-panel: #0d2024;
      --border: rgba(90, 180, 176, 0.28);
      --border-strong: rgba(90, 180, 176, 0.48);
      --text: #eefcff;
      --muted: #9bc4c8;
      --accent: #57e5ce;
      --accent-rgb: 87, 229, 206;
      --blue: #7dd3fc;
      --green: #86efac;
      --amber: #fde68a;
      --shadow: 0 22px 60px rgba(0, 0, 0, 0.28);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(rgba(48, 111, 105, 0.16) 1px, transparent 1px),
        linear-gradient(90deg, rgba(48, 111, 105, 0.16) 1px, transparent 1px),
        radial-gradient(circle at 18% 8%, rgba(var(--accent-rgb), 0.14), transparent 34%),
        var(--bg-deep);
      background-size: 28px 28px, 28px 28px, auto, auto;
      color: var(--text);
      font-family: "Inter", "Microsoft YaHei", "PingFang SC", sans-serif;
    }

    .page {
      width: min(1760px, calc(100vw - 64px));
      margin: 0 auto;
      padding: 28px 0 48px;
    }

    .topbar {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 34px;
      line-height: 1.1;
    }

    .muted {
      color: var(--muted);
      font-size: 13px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 10px;
    }

    .control {
      display: grid;
      gap: 6px;
      min-width: 172px;
    }

    .control label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .control input {
      width: 100%;
      min-height: 38px;
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(10, 22, 26, 0.92);
      color: var(--text);
      font: inherit;
    }

    .preview-shell {
      padding: 18px;
      border-radius: 22px;
      border: 1px solid var(--border);
      background: rgba(7, 17, 20, 0.82);
      box-shadow: var(--shadow);
    }

    .variants {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .variant {
      display: grid;
      gap: 12px;
    }

    .variant-head {
      min-height: 62px;
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 12px;
    }

    .variant-title {
      margin: 0;
      font-size: 18px;
      line-height: 1.25;
    }

    .variant-note {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .pick {
      flex: 0 0 auto;
      min-height: 34px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid var(--border-strong);
      background: rgba(var(--accent-rgb), 0.12);
      color: var(--accent);
      font-weight: 800;
      font-size: 12px;
    }

    .dispatch-result {
      height: 482px;
      display: grid;
      grid-template-rows: 172px 1fr;
      gap: 14px;
      padding: 16px;
      border-radius: 18px;
      border: 1px solid var(--border);
      background: rgba(8, 18, 22, 0.9);
      overflow: hidden;
    }

    .summary-card {
      height: 172px;
      min-height: 172px;
      max-height: 172px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: var(--bg-card-raised);
      box-shadow: inset 0 0 0 1px rgba(var(--accent-rgb), 0.04);
      overflow: hidden;
    }

    .tray-no {
      margin: 0;
      font-size: 22px;
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .line {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 6px;
      margin-top: 6px;
      font-size: 13px;
    }

    .line span {
      color: var(--muted);
    }

    .line strong {
      color: var(--text);
    }

    .badge,
    .chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      min-height: 28px;
      height: 28px;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(12, 32, 36, 0.88);
      color: var(--text);
      font-size: 12px;
      font-weight: 800;
      line-height: 1;
      white-space: nowrap;
      aspect-ratio: auto;
    }

    .badge.accent {
      border-color: rgba(var(--accent-rgb), 0.44);
      background: rgba(var(--accent-rgb), 0.14);
      color: var(--accent);
    }

    .chip {
      border-color: rgba(14, 165, 233, 0.45);
      background: rgba(14, 165, 233, 0.14);
      color: var(--blue);
    }

    .chip:nth-child(2n) {
      border-color: rgba(16, 185, 129, 0.42);
      background: rgba(16, 185, 129, 0.14);
      color: var(--green);
    }

    .chip:nth-child(3n) {
      border-color: rgba(245, 158, 11, 0.42);
      background: rgba(245, 158, 11, 0.16);
      color: var(--amber);
    }

    .chip-list {
      min-width: 0;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      overflow: auto;
      scrollbar-width: thin;
    }

    .destinations {
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .destination-card {
      min-height: 0;
      padding: 16px;
      display: grid;
      gap: 14px;
      border-radius: 16px;
      border: 1px solid rgba(var(--accent-rgb), 0.26);
      background: rgba(16, 27, 34, 0.92);
    }

    .destination-card:first-child {
      border-color: rgba(245, 158, 11, 0.36);
    }

    .destination-card h4 {
      margin: 0;
      font-size: 17px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 8px;
      border-bottom: 1px dashed rgba(148, 163, 184, 0.28);
      font-size: 13px;
    }

    .row span {
      color: var(--muted);
    }

    .row strong {
      text-align: right;
    }

    .action {
      width: 100%;
      min-height: 42px;
      border-radius: 8px;
      border: 1px solid var(--border-strong);
      background: transparent;
      color: #c5f8f1;
      font-weight: 800;
    }

    .summary-a {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      gap: 24px;
      align-items: start;
      padding: 18px 20px;
    }

    .summary-a .metrics {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .summary-a .chip-list {
      grid-column: 2;
      align-self: end;
      justify-content: flex-end;
      max-height: 68px;
    }

    .summary-b {
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 14px;
      padding: 16px 18px;
    }

    .summary-b .top {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 10px;
      align-items: start;
    }

    .summary-b .stat {
      min-width: 92px;
      height: 54px;
      display: grid;
      align-content: center;
      justify-items: center;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(10, 28, 32, 0.82);
    }

    .summary-b .stat span {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }

    .summary-b .stat strong {
      margin-top: 2px;
      font-size: 18px;
    }

    .summary-b .chip-list {
      align-content: start;
      max-height: 70px;
    }

    .summary-c {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 250px;
      grid-template-rows: auto 1fr;
      gap: 12px 20px;
      padding: 16px 18px;
    }

    .summary-c .status-rail {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .summary-c .rail-item {
      min-height: 34px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid rgba(var(--accent-rgb), 0.24);
      background: rgba(9, 26, 30, 0.82);
      font-size: 12px;
    }

    .summary-c .rail-item span {
      color: var(--muted);
    }

    .summary-c .chip-list {
      justify-content: flex-end;
      align-content: start;
      max-height: 66px;
    }

    @media (max-width: 1280px) {
      .variants {
        grid-template-columns: 1fr;
      }

      .dispatch-result {
        height: 482px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="topbar">
      <div>
        <h1>接驳出库摘要卡三方案</h1>
        <div class="muted">固定卡片高度：172px。调整样品数和实验数时，卡片尺寸不会变化，标签只在内部换行或滚动。</div>
      </div>
      <div class="controls">
        <div class="control">
          <label for="sampleCount">样品数量</label>
          <input id="sampleCount" type="number" min="1" max="999" value="2" />
        </div>
        <div class="control">
          <label for="experimentCount">实验数量</label>
          <input id="experimentCount" type="number" min="1" max="12" value="2" />
        </div>
      </div>
    </div>

    <section class="preview-shell">
      <div class="variants">
        <article class="variant">
          <div class="variant-head">
            <div>
              <h2 class="variant-title">方案 A：左右信息栏</h2>
              <div class="variant-note">最接近当前页面，右侧集中展示摘要和实验标签。</div>
            </div>
            <button class="pick" type="button">选择 A</button>
          </div>
          <div class="dispatch-result">
            <section class="summary-card summary-a" data-variant="A"></section>
            <div class="destinations"></div>
          </div>
        </article>

        <article class="variant">
          <div class="variant-head">
            <div>
              <h2 class="variant-title">方案 B：指标仪表栏</h2>
              <div class="variant-note">样品数/实验数变成固定指标块，扫描后信息更醒目。</div>
            </div>
            <button class="pick" type="button">选择 B</button>
          </div>
          <div class="dispatch-result">
            <section class="summary-card summary-b" data-variant="B"></section>
            <div class="destinations"></div>
          </div>
        </article>

        <article class="variant">
          <div class="variant-head">
            <div>
              <h2 class="variant-title">方案 C：状态横条</h2>
              <div class="variant-note">用横条承载任务/状态/数量，下面只留托盘和标签。</div>
            </div>
            <button class="pick" type="button">选择 C</button>
          </div>
          <div class="dispatch-result">
            <section class="summary-card summary-c" data-variant="C"></section>
            <div class="destinations"></div>
          </div>
        </article>
      </div>
    </section>
  </main>

  <script>
    const labels = [
      "冲击试验",
      "高低温湿热试验",
      "温度冲击试验",
      "盐雾试验",
      "霉菌试验",
      "振动试验",
      "四综合试验",
      "低气压试验",
      "淋雨试验",
      "砂尘试验",
      "耐久试验",
      "通电试验",
    ];

    const tray = {
      trayNo: "SYLU-2026-07-001-TP-001",
      taskNo: "SYLU-2026-07-001",
      status: "实验前外观检测间存放",
    };

    const sampleInput = document.querySelector("#sampleCount");
    const experimentInput = document.querySelector("#experimentCount");

    const clamp = (value, min, max) => Math.min(max, Math.max(min, Number(value) || min));

    const chipHtml = (count) => labels.slice(0, count).map((label) => `<span class="chip">${label}</span>`).join("");

    const commonText = (sampleCount) => `
      <div>
        <h3 class="tray-no">${tray.trayNo}</h3>
        <div class="line"><span>任务编号</span><strong>${tray.taskNo}</strong></div>
        <div class="line"><span>当前状态</span><strong>${tray.status}</strong></div>
      </div>
    `;

    const renderSummary = (variant, sampleCount, experimentCount) => {
      const chips = chipHtml(experimentCount);
      if (variant === "A") {
        return `
          ${commonText(sampleCount)}
          <div class="metrics">
            <span class="badge">托盘摘要</span>
            <span class="badge accent">样品数 ${sampleCount}</span>
            <span class="badge accent">实验数 ${experimentCount}</span>
          </div>
          <div class="chip-list">${chips}</div>
        `;
      }
      if (variant === "B") {
        return `
          <div class="top">
            ${commonText(sampleCount)}
            <div class="stat"><span>样品数</span><strong>${sampleCount}</strong></div>
            <div class="stat"><span>实验数</span><strong>${experimentCount}</strong></div>
          </div>
          <div class="chip-list">${chips}</div>
        `;
      }
      return `
        <div class="status-rail">
          <div class="rail-item"><span>任务</span><strong>${tray.taskNo}</strong></div>
          <div class="rail-item"><span>样品</span><strong>${sampleCount}</strong></div>
          <div class="rail-item"><span>实验</span><strong>${experimentCount}</strong></div>
        </div>
        <div>
          <h3 class="tray-no">${tray.trayNo}</h3>
          <div class="line"><span>当前状态</span><strong>${tray.status}</strong></div>
        </div>
        <div class="chip-list">${chips}</div>
      `;
    };

    const renderDestinations = () => `
      <article class="destination-card">
        <h4>恒温恒湿间（暂存间）</h4>
        <div class="row"><span>对应实验</span><strong>暂存间</strong></div>
        <div class="row"><span>任务编号</span><strong>${tray.taskNo}</strong></div>
        <button class="action" type="button">送往此处</button>
      </article>
      <article class="destination-card">
        <h4>高低温湿热一室</h4>
        <div class="row"><span>对应实验</span><strong>高低温湿热试验</strong></div>
        <div class="row"><span>排程时间</span><strong>06/24 08:00 - 06/24 11:30</strong></div>
        <button class="action" type="button">送往此处</button>
      </article>
    `;

    const render = () => {
      const sampleCount = clamp(sampleInput.value, 1, 999);
      const experimentCount = clamp(experimentInput.value, 1, labels.length);
      sampleInput.value = sampleCount;
      experimentInput.value = experimentCount;

      document.querySelectorAll(".summary-card").forEach((card) => {
        card.innerHTML = renderSummary(card.dataset.variant, sampleCount, experimentCount);
      });
      document.querySelectorAll(".destinations").forEach((grid) => {
        grid.innerHTML = renderDestinations();
      });
    };

    sampleInput.addEventListener("input", render);
    experimentInput.addEventListener("input", render);
    render();
  </script>
</body>
</html>
