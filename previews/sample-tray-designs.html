  const firstTask = prefix + '-001';
  const secondTask = prefix + '-002';
  const formatNumber = number => String(number).padStart(3, '0');
  const trayCode = (task, number) => task + '-TP-' + formatNumber(number);
  const traySamples = (task, trayNumber, sampleNumbers, status, location) =>
    sampleNumbers.map(number => ({
      task, tray: trayCode(task, trayNumber), sample: task + '-SP-' + formatNumber(number), status, location
    }));
  const unassignedSample = { task: secondTask, sample: secondTask + '-SP-001', tray: '', status: 'transit', location: '' };
  const baseTraySamples = [
    ...traySamples(firstTask, 1, [1, 2, 3, 4], 'returned', '厂家收回'),
    ...traySamples(firstTask, 2, [5, 6, 7], 'arrived', '接驳区')
  ];
  const records = [...baseTraySamples, unassignedSample];
  const additionalTrays = [3, 4, 5, 6, 7];
  const groupedRecords = [
    ...baseTraySamples,
    ...traySamples(firstTask, 2, [8, 9, 10, 11], 'arrived', '接驳区'),
    ...additionalTrays.flatMap((number, index) => traySamples(firstTask, number, [12 + index], 'arrived', '接驳区')),
    ...traySamples(secondTask, 1, [2], 'arrived', '接驳区'),
    unassignedSample
  ];
  const statuses = { arrived: '到货', transit: '样品运输中', returned: '厂家收回' };
  const taskFlowStages = [
    ['waiting', '待排程'],
    ['scheduled', '已排程'],
    ['running', '任务进行中'],
    ['completed', '任务已完成'],
    ['returned', '厂家收回']
  ];
  const taskFlowSnapshots = new Map([[firstTask, 'scheduled'], [secondTask, 'waiting']]);
  const trayFlowStages = [
    ['transit', '样品运输中'],
    ['arrived', '到货'],
    ['pre-storage', '实验前暂存'],
    ['experiment', '实验室试验'],
    ['post-storage', '实验后暂存'],
    ['returned', '厂家收回']
  ];
  const arrivalSnapshot = { stage: 'arrived', location: '接驳区' };
  const trayFlowSnapshots = new Map([
    [trayCode(firstTask, 1), { stage: 'returned', location: '厂家收回' }],
    ...[2, ...additionalTrays].map(number => [trayCode(firstTask, number), arrivalSnapshot]),
    [trayCode(secondTask, 1), arrivalSnapshot]
  ]);
  const views = { samples: '样品流转', storage: '暂存间', trays: '托盘信息' };
  const destinations = [
    ['layout-dashboard', '中控总览'], ['clipboard-list', '任务受理'], ['layers', '任务/托盘总览'],
    ['inbox', '样品预接驳'], ['calendar-days', '排程看板'], ['package-search', '样品/托盘信息'],
    ['flask-conical', '试验过程管控'], ['cpu', '设备资源'], ['database', '试验数据'],
    ['users', '人员信息'], ['history', '历史任务数据']
  ];
  const byKey = new Map(groupedRecords.map(record => [record.sample, record]));
  const variants = ['table', 'trays', 'inspector'];
  const icon = name => '<i data-lucide="' + name + '" aria-hidden="true"></i>';
  const mono = (value, extra = '') => '<span class="id ' + extra + '">' + value + '</span>';
  const stateBadge = status => '<span class="state ' + status + '">' + statuses[status] + '</span>';
  const placeholder = text => '<p class="empty">' + text + '</p>';
  const trayName = tray => tray ? tray.slice(-6) : '未关联托盘';
  const locationName = location => location || '未记录';
  const rowButton = (kind, key, readableKey) =>
    '<button type="button" class="text-action" data-' + kind + '="' + key +
    '" aria-label="查看 ' + readableKey + ' 详情">详情</button>';
  const fact = (label, value) => '<div><dt>' + label + '</dt><dd>' + value + '</dd></div>';
  const panelHead = (heading, context, action = '') =>
    '<div class="panel-head"><div><h3>' + heading + '</h3>' +
    (context ? '<p>' + context + '</p>' : '') + '</div>' + action + '</div>';
  const option = (value, label) => '<option value="' + value + '">' + label + '</option>';
  const trayGroups = (data, includeUnassigned) => {
    const groups = new Map();
    for (const sample of data) {
      if (!sample.tray && !includeUnassigned) continue;
      if (!groups.has(sample.tray)) groups.set(sample.tray, []);
      groups.get(sample.tray).push(sample);
    }
    return Array.from(groups, ([tray, samples]) => ({ tray, samples }));
  };
  const sampleFacts = record =>
    '<dl class="facts">' + fact('当前状态', stateBadge(record.status)) +
    fact('当前位置', locationName(record.location)) + fact('任务编号', mono(record.task)) +
    fact('托盘编号', record.tray ? mono(record.tray) : '未关联托盘') + '</dl>';
  const tableHeading = (label, column, state, extra = '') => {
    const direction = state.sort === column ? (state.desc ? 'descending' : 'ascending') : '';
    return '<th scope="col" class="' + extra + '"' + (direction ? ' aria-sort="' + direction + '"' : '') + '>' +
      '<button type="button" class="sort" data-sort="' + column + '">' + label +
      '<span class="sort-symbol" aria-hidden="true">' + (direction ? (state.desc ? '↓' : '↑') : '↕') +
      '</span></button></th>';
  };
  const toolbar = layout => {
    const trayMode = layout === 'trays';
    return '<div class="toolbar"><label class="filter search-field">关键词' +
      '<input class="field" type="search" data-filter="query" placeholder="样品号、托盘号、任务号或位置"></label>' +
      '<label class="filter">任务<select class="field" data-filter="task">' +
      option('', '全部任务') + option(firstTask, firstTask) + option(secondTask, secondTask) +
      '</select></label>' + (trayMode ? '' :
        '<label class="filter">样品状态<select class="field" data-filter="status">' +
        option('', '全部状态') + Object.entries(statuses).map(([key, value]) => option(key, value)).join('') +
        '</select></label>') + '</div>' +
      (trayMode ? '<div class="status-strip" aria-label="样品状态">' +
        [['', '全部状态'], ...Object.entries(statuses)].map(([key, label]) =>
          '<button type="button" class="control status-filter" data-status="' + key +
          '" aria-pressed="' + (key === '') + '">' + label + '</button>').join('') + '</div>' : '');
  };
  const markup = (layout, label) => `
    <div class="mes-demo" data-layout="${layout}" aria-label="${label}">
      <aside class="sidebar" aria-label="中控系统">
        <div class="brand">
          <div class="brand-mark">${icon('boxes')}<span class="brand-fallback" aria-hidden="true">控</span></div>
          <div><span class="brand-name">实验室中控</span><span class="brand-area">七二四新火工区</span></div>
        </div>
        <ul class="navlist">
          ${destinations.map(([glyph, name]) => '<li class="navitem"' +
            (name === '样品/托盘信息' ? ' aria-current="page"' : '') + '>' + icon(glyph) + name + '</li>').join('')}
        </ul>
        <div class="connections">
          <div class="connection"><span>LIMS</span><span class="online">已连接</span></div>
          <div class="connection"><span>上位机系统</span><span class="online">已连接</span></div>
        </div>
      </aside>
      <div class="workspace">
        <div class="titlebar"><h2>样品 / 托盘信息</h2><span class="demo-label">示例数据</span></div>
        <nav class="views" aria-label="页面视图">
          ${Object.entries(views).map(([key, text]) =>
            '<button type="button" class="view" data-view="' + key + '" aria-pressed="' +
            (key === 'samples') + '">' + text + '</button>').join('')}
        </nav>
        <div class="panel" data-toolbar>${toolbar(layout)}</div>
        <div data-content style="margin-top:10px"></div>
        <p class="sr" data-announcement role="status"></p>
      </div>
      <dialog aria-label="记录详情">
        <div class="panel-head"><h3 data-dialog-heading></h3>
          <form method="dialog"><button type="submit" class="control" autofocus>关闭</button></form>
        </div>
        <div class="inspect-body" data-dialog-body></div>
      </dialog>
    </div>`;

  function mount(section, layout) {
    section.innerHTML = markup(layout, section.dataset.variant);
    const demo = section.querySelector('.mes-demo');
    const filters = demo.querySelector('[data-toolbar]');
    const content = demo.querySelector('[data-content]');
    const dialog = demo.querySelector('dialog');
    const announcement = demo.querySelector('[data-announcement]');
    const state = {
      view: 'samples', query: '', task: '', status: '', sort: 'sample', desc: false,
      page: 1, pageSize: 8, tray: firstTask + '-TP-002', sample: records[2].sample
    };
    const design = { rowPadding: 8, trayWidth: 32, inspectorWidth: 41 };

    function getMatches() {
      const query = state.query.trim().toUpperCase();
      const data = layout === 'trays' ? groupedRecords : records;
      return data.filter(record =>
        (!state.task || record.task === state.task) && (!state.status || record.status === state.status) &&
        (!query || [record.sample, record.task, record.tray, record.location, statuses[record.status]]
          .some(field => field.toUpperCase().includes(query))));
    }

    function renderTable(data) {
      const trayView = state.view === 'trays';
      const list = trayView ? trayGroups(data, false) : data.slice();
      const labels = { sample: '样品编号', tray: '托盘编号', task: '任务编号', location: '当前位置', status: '状态' };
      const currentSort = trayView ? 'tray' : state.sort;
      const sortKey = record => record[currentSort] || '';
      list.sort((left, right) =>
        (state.desc ? -1 : 1) * sortKey(left).localeCompare(sortKey(right), 'zh-CN'));
      const pages = Math.max(1, Math.ceil(list.length / state.pageSize));
      state.page = Math.min(state.page, pages);
      const from = (state.page - 1) * state.pageSize;
      const shown = list.slice(from, from + state.pageSize);
      const resultLabel = list.length + (trayView ? ' 个托盘' : ' 条样品');
      const headings = trayView
        ? tableHeading(labels.tray, 'tray', { ...state, sort: currentSort }) + '<th scope="col">关联样品</th>'
        : tableHeading(labels.sample, 'sample', state) + tableHeading(labels.task, 'task', state, 'task-cell secondary-cell') +
          tableHeading(labels.tray, 'tray', state, 'secondary-cell') +
          tableHeading(labels.location, 'location', state, 'secondary-cell') + tableHeading(labels.status, 'status', state);
      const rows = shown.map(row => trayView
        ? '<tr><td>' + mono(row.tray, 'primary-id') + '</td><td>' + row.samples.length + ' 件</td><td>' +
          rowButton('tray-detail', row.tray, row.tray) + '</td></tr>'
        : '<tr><td>' + mono(row.sample, 'primary-id') + '</td><td class="task-cell secondary-cell">' + mono(row.task) +
          '</td><td class="secondary-cell">' + (row.tray ? mono(row.tray) : '<span class="muted">未关联</span>') +
          '</td><td class="location secondary-cell">' + locationName(row.location) +
          '</td><td>' + stateBadge(row.status) + '</td><td>' +
          rowButton('sample-detail', row.sample, row.sample) + '</td></tr>');
      return '<section class="panel" aria-label="' + views[state.view] + '">' +
        (rows.length ? '<div class="table-shell"><table class="full-table"><thead><tr>' + headings +
          '<th scope="col">操作</th></tr></thead><tbody>' + rows.join('') + '</tbody></table></div>'
          : placeholder('没有匹配的' + (trayView ? '托盘' : '样品'))) +
        '<div class="result-footer"><span>共 ' + resultLabel + '</span>' +
        '<div class="pagination"><label><span class="sr">每页条数</span><select class="control" data-page-size>' +
        [4, 8].map(size => '<option value="' + size + '"' + (size === state.pageSize ? ' selected' : '') +
          '>每页 ' + size + ' 条</option>').join('') + '</select></label>' +
        '<button type="button" class="control" data-page="-1"' + (state.page === 1 ? ' disabled' : '') +
        ' aria-label="上一页">‹</button><span>第 ' + state.page + ' / ' + pages + ' 页</span>' +
        '<button type="button" class="control" data-page="1"' + (state.page === pages ? ' disabled' : '') +
        ' aria-label="下一页">›</button></div></div></section>';
    }

    function renderFlow(title, caption, stages, activeStage) {
      const steps = stages.map(([key, label]) => {
        const current = key === activeStage;
        return '<li class="tray-flow-step"' + (current ? ' aria-current="step"' : '') + '>' +
          '<span class="tray-flow-dot" aria-hidden="true"></span><span>' + label + '</span>' +
          (current ? '<span class="tray-flow-current">当前</span>' : '') + '</li>';
      }).join('');
      return '<section class="tray-flow" aria-label="' + title + '">' +
        '<div class="tray-flow-head"><div class="tray-flow-title"><h4>' + title + '</h4>' +
        '<span class="tray-flow-context">流程示意</span></div>' +
        '<span class="tray-flow-context">' + caption + '</span></div>' +
        '<ol class="tray-flow-steps">' + steps + '</ol></section>';
    }

    function renderTrays(data) {
      const groups = trayGroups(data, state.view !== 'trays');
      if (!groups.length) return '<section class="panel">' + placeholder('没有匹配的记录') + '</section>';
      const selected = groups.find(group => group.tray === state.tray) || groups[0];
      const task = selected.samples[0].task;
      const taskFlow = renderFlow('任务流程图', '所属任务 ' + mono(task), taskFlowStages, taskFlowSnapshots.get(task));
      const traySnapshot = trayFlowSnapshots.get(selected.tray);
      const trayFlow = traySnapshot
        ? renderFlow('托盘流程图', '当前位置 <strong>' + traySnapshot.location + '</strong>', trayFlowStages, traySnapshot.stage)
        : '';
      state.tray = selected.tray;
      const catalog = groups.map(({ tray, samples }) => {
        const caption = tray ? mono(samples[0].task) : '等待分配托盘';
        return '<button type="button" class="tray-choice" data-tray="' + tray +
          '" aria-pressed="' + (tray === state.tray) + '"><span class="tray-title"><b>' + trayName(tray) +
          '</b><span class="tray-count">' + samples.length + ' 件</span></span><span class="tray-meta">' +
          caption + '</span></button>';
      }).join('');
      const rows = selected.samples.map(record =>
        '<tr><td>' + mono(record.sample, 'primary-id') + '</td><td class="location tray-location">' +
        locationName(record.location) + '</td><td>' + stateBadge(record.status) + '</td><td>' +
        rowButton('sample-detail', record.sample, record.sample) + '</td></tr>').join('');
      return '<div class="split"><section class="panel">' +
        panelHead('托盘分组', groups.filter(group => group.tray).length + ' 个托盘') +
        '<div class="catalog" data-tray-scroll>' + catalog + '</div></section><section class="panel">' +
        panelHead(selected.tray || '未关联托盘', '匹配样品 ' + selected.samples.length + ' 件') +
        taskFlow + trayFlow +
        '<div class="table-shell tray-samples" role="region" aria-label="关联样品">' +
        '<table><thead><tr><th scope="col">样品编号</th><th scope="col" class="tray-location">位置</th>' +
        '<th scope="col">状态</th><th scope="col">操作</th></tr></thead><tbody>' + rows +
        '</tbody></table></div></section></div>';
    }

    function renderInspector(data) {
      if (!data.length) return '<section class="panel">' + placeholder('没有匹配的样品') + '</section>';
      const selected = data.find(record => record.sample === state.sample) || data[0];
      state.sample = selected.sample;
      const list = data.map(record =>
        '<li><button type="button" class="sample-choice" data-sample="' + record.sample +
        '" aria-pressed="' + (record === selected) + '" aria-label="' + record.sample + '，' +
        statuses[record.status] + '"><span class="record-id">' + mono(record.sample.slice(-6), 'primary-id') +
        mono(record.task) + '</span>' + stateBadge(record.status) + '</button></li>').join('');
      const picker = '<label class="filter record-picker">查阅样品<select class="field id" data-record-picker>' +
        data.map(record => '<option value="' + record.sample + '"' + (record === selected ? ' selected' : '') +
          '>' + record.sample + '</option>').join('') + '</select></label>';
      const navigation = '<div class="small-controls">' +
        '<button type="button" class="control" data-step="-1" aria-label="上一条样品"' +
        (data[0] === selected ? ' disabled' : '') + '>‹</button>' +
        '<button type="button" class="control" data-step="1" aria-label="下一条样品"' +
        (data.at(-1) === selected ? ' disabled' : '') + '>›</button></div>';
      return '<div class="split"><section class="panel" aria-label="样品列表">' +
        panelHead('样品列表', '共 ' + data.length + ' 条') + picker + '<ul class="record-list">' + list +
        '</ul></section><section class="panel" aria-label="样品详情">' +
        panelHead('样品详情', '第 ' + (data.indexOf(selected) + 1) + ' / ' + data.length + ' 条', navigation) +
        '<div class="inspect-body"><h4>样品编号</h4>' + mono(selected.sample, 'primary-id detail-id') +
        sampleFacts(selected) + '</div></section></div>';
    }

    function render(focusTarget = '', fallbackTarget = '[aria-pressed="true"]') {
      const data = getMatches();
      const trayScroll = content.querySelector('[data-tray-scroll]')?.scrollTop ?? 0;
      filters.hidden = state.view === 'storage';
      for (const button of demo.querySelectorAll('[data-view], [data-status]')) {
        const selected = button.hasAttribute('data-view')
          ? button.dataset.view === state.view : button.dataset.status === state.status;
        button.setAttribute('aria-pressed', selected);
      }
      if (state.view === 'storage') {
        content.innerHTML = '<section class="panel">' + panelHead('暂存间', '') + placeholder('示例中暂无暂存记录') + '</section>';
      } else if (layout === 'trays') {
        content.innerHTML = renderTrays(data);
      } else if (layout === 'inspector' && state.view === 'samples') {
        content.innerHTML = renderInspector(data);
      } else {
        content.innerHTML = renderTable(data);
      }
      const trayCatalog = content.querySelector('[data-tray-scroll]');
      if (trayCatalog) trayCatalog.scrollTop = trayScroll;
      announcement.textContent = state.view === 'storage' ? '示例中暂无暂存记录' :
        state.view === 'trays' ? '匹配 ' + trayGroups(data, false).length + ' 个托盘' :
        '匹配 ' + data.length + ' 条样品';
      if (focusTarget) (content.querySelector(focusTarget) ||
        content.querySelector(fallbackTarget) || demo.querySelector('[data-view][aria-pressed="true"]')).focus({ preventScroll: true });
    }

    function detail(kind, key) {
      const heading = dialog.querySelector('[data-dialog-heading]');
      const body = dialog.querySelector('[data-dialog-body]');
      if (kind === 'sample') {
        heading.textContent = '样品详情';
        body.innerHTML = mono(key, 'primary-id detail-id') + sampleFacts(byKey.get(key));
      } else {
        heading.textContent = '托盘详情';
        const samples = records.filter(record => record.tray === key);
        body.innerHTML = mono(key, 'primary-id detail-id') + '<dl class="facts">' +
          fact('任务编号', mono(samples[0].task)) + fact('关联样品', samples.length + ' 件') + '</dl>' +
          '<ul class="context-list">' + samples.map(item => '<li>' + mono(item.sample) + '</li>').join('') + '</ul>';
      }
      dialog.showModal();
    }

    demo.addEventListener('input', event => {
      const field = event.target.dataset.filter;
      if (!field) return;
      state[field] = event.target.value;
      state.page = 1;
      render();
    });
    demo.addEventListener('change', event => {
      if (event.target.hasAttribute('data-record-picker')) {
        state.sample = event.target.value;
        return render('[data-record-picker]');
      }
      if (!event.target.hasAttribute('data-page-size')) return;
      state.pageSize = Number(event.target.value);
      state.page = 1;
      render('[data-page-size]');
    });
    demo.addEventListener('click', event => {
      const button = event.target.closest('button');
      if (!button || dialog.contains(button)) return;
      const action = button.dataset;
      if (action.sampleDetail) return detail('sample', action.sampleDetail);
      if (action.trayDetail) return detail('tray', action.trayDetail);
      if (action.view) {
        if (state.view === action.view) return;
        state.view = action.view;
        state.page = 1;
        state.sort = action.view === 'trays' ? 'tray' : 'sample';
        state.desc = false;
        return render();
      }
      if (action.status !== undefined) {
        state.status = action.status;
        state.page = 1;
        return render();
      }
      if (action.step) {
        const matches = getMatches();
        const position = matches.findIndex(record => record.sample === state.sample);
        state.sample = matches[position + Number(action.step)].sample;
        return render('[data-step="' + action.step + '"]:not(:disabled)', '[data-step]:not(:disabled)');
      }
      if (action.sort) {
        state.desc = state.sort === action.sort && !state.desc;
        state.sort = action.sort;
        state.page = 1;
      } else if (action.tray !== undefined) {
        if (state.tray === action.tray) return;
        state.tray = action.tray;
      } else if (action.sample) {
        state.sample = action.sample;
      } else if (action.page) {
        state.page += Number(action.page);
        return render('[data-page="' + action.page + '"]:not(:disabled)', '[data-page]:not(:disabled)');
      } else {
        return;
      }
      const attribute = Object.keys(action)[0];
      render('[data-' + attribute + '="' + action[attribute] + '"]');
    });

    render();
    if (globalThis.Tweak) {
      const tweak = new Tweak({ container: demo, onChange: () => {
        demo.style.setProperty('--row-pad', design.rowPadding + 'px');
        demo.style.setProperty('--tray-size', design.trayWidth + '%');
        demo.style.setProperty('--inspector-size', design.inspectorWidth + '%');
      } });
      if (layout === 'table') tweak.addSlider(design, 'rowPadding', { label: '表格行内边距', min: 5, max: 12, unit: 'px' });
      if (layout === 'trays') tweak.addSlider(design, 'trayWidth', { label: '托盘分组栏宽度', min: 28, max: 40, unit: '%' });
      if (layout === 'inspector') tweak.addSlider(design, 'inspectorWidth', { label: '详情栏宽度', min: 36, max: 50, unit: '%' });
    }
  }

  Array.from(root.children).forEach((section, index) => mount(section, variants[index]));
})();
</script>
