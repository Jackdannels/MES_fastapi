<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>暂存间 / 外观检测间 · 三套布局方案</title>
  <style>
    :root {
      --bg: #061014;
      --bg-deep: #03090d;
      --surface: rgba(13, 29, 36, .94);
      --surface-strong: #102a32;
      --line: rgba(86, 205, 196, .24);
      --line-strong: rgba(86, 205, 196, .52);
      --text: #f4fffd;
      --muted: #91b6b6;
      --accent: #25d6ca;
      --accent-soft: rgba(37, 214, 202, .14);
      --danger: #ee7160;
      --gutter: clamp(14px, 1.25vw, 24px);
      --gap: clamp(10px, .9vw, 18px);
      --radius: 14px;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg-deep);
      color: var(--text);
      font-family: "Fira Sans", "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .55;
      background:
        linear-gradient(rgba(37, 214, 202, .035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(37, 214, 202, .035) 1px, transparent 1px);
      background-size: 42px 42px;
    }

    .preview {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      width: 100vw;
      height: 100dvh;
      padding: var(--gutter);
      gap: var(--gap);
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: var(--gap);
      min-height: 76px;
      padding: 12px 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(7, 19, 24, .9);
    }

    .kicker {
      color: var(--accent);
      font-size: clamp(12px, .8vw, 15px);
      font-weight: 800;
      letter-spacing: .12em;
    }

    h1 {
      margin: 4px 0 0;
      font-size: clamp(24px, 1.65vw, 34px);
      line-height: 1.1;
    }

    .switches { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    button { font: inherit; }
    .switch {
      min-height: 44px;
      padding: 0 16px;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--muted);
      background: rgba(8, 25, 31, .94);
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: background .2s ease, color .2s ease, border-color .2s ease;
    }
    .switch:hover, .switch:focus-visible { border-color: var(--line-strong); color: var(--text); }
    .switch.is-active { border-color: var(--accent); color: #031113; background: var(--accent); }

    .screen {
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr) auto auto;
      gap: var(--gap);
      min-height: 0;
      padding: clamp(14px, 1.35vw, 26px);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(135deg, rgba(13, 40, 47, .9), rgba(5, 16, 21, .96));
      overflow: hidden;
    }

    .screen-head { display: flex; align-items: end; justify-content: space-between; gap: 18px; }
    .screen-head p { margin: 5px 0 0; color: var(--muted); font-size: clamp(14px, .95vw, 17px); font-weight: 700; }
    .resolution { color: var(--accent); font: 700 clamp(12px, .75vw, 14px)/1.2 "Fira Code", Consolas, monospace; white-space: nowrap; }

    .metric {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 20px;
      min-height: clamp(102px, 10vh, 148px);
      padding: clamp(14px, 1.2vw, 24px) clamp(20px, 2vw, 38px);
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      background: linear-gradient(120deg, rgba(37, 214, 202, .17), rgba(10, 35, 42, .96));
      box-shadow: 0 16px 34px rgba(0, 0, 0, .24);
    }
    .metric-label { color: var(--accent); font-size: clamp(18px, 1.2vw, 25px); font-weight: 900; }
    .metric-value { font-size: clamp(54px, 4.3vw, 82px); line-height: .9; font-weight: 900; font-variant-numeric: tabular-nums; }
    .metric-unit { color: var(--muted); font-size: clamp(18px, 1.1vw, 24px); font-weight: 800; }
    .metric-note { justify-self: end; color: var(--muted); font-size: clamp(13px, .85vw, 16px); font-weight: 700; text-align: right; }

    .tray-area { min-height: 0; display: grid; }
    .tray-grid { min-height: 0; display: grid; gap: var(--gap); }
    .option-a .tray-grid,
    .option-b .tray-grid,
    .option-c .tray-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-template-rows: repeat(3, minmax(0, 1fr));
    }

    .tray-card {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) auto;
      align-items: center;
      gap: clamp(12px, 1.25vw, 24px);
      min-width: 0;
      min-height: 0;
      padding: clamp(14px, 1.2vw, 24px);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(11, 30, 37, .94);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .025);
      transition: transform .2s ease, border-color .2s ease, background .2s ease;
    }
    .tray-card:hover { transform: translateY(-2px); border-color: var(--line-strong); background: rgba(15, 45, 53, .96); }
    .tray-card__field { min-width: 0; display: grid; gap: 7px; }
    .tray-card__field strong { min-width: 0; color: var(--text); font: 800 clamp(29px, 2.15vw, 42px)/1.05 "Fira Code", Consolas, monospace; overflow-wrap: anywhere; }
    .tray-card__task { text-align: center; }
    .tray-card__task strong { color: #d8fffb; font-size: clamp(17px, 1.2vw, 24px); }
    .tray-card__qty { justify-items: end; text-align: right; }
    .tray-card__qty strong { color: var(--accent); font-size: clamp(22px, 1.5vw, 32px); }

    .option-a .tray-card__field { justify-items: center; text-align: center; }
    .option-b .tray-card, .option-c .tray-card { grid-template-columns: 1fr; text-align: center; justify-items: center; align-content: center; gap: 12px; }
    .option-b .tray-card__task, .option-b .tray-card__qty, .option-c .tray-card__task, .option-c .tray-card__qty { justify-items: center; text-align: center; }
    .option-b .tray-card { background: rgba(8, 27, 34, .98); }
    .option-c .tray-card { border-radius: 8px; background: linear-gradient(135deg, rgba(16, 47, 55, .96), rgba(8, 25, 31, .96)); }

    .actionbar { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--gap); }
    .action { min-height: 56px; border: 1px solid var(--line); border-radius: 10px; color: var(--text); background: rgba(10, 31, 38, .9); font-size: clamp(16px, 1vw, 20px); font-weight: 900; }
    .action--in { border-color: rgba(37, 214, 202, .52); background: rgba(37, 214, 202, .14); }
    .action--out { border-color: rgba(238, 113, 96, .5); background: rgba(238, 113, 96, .12); }

    .scheme-note { color: var(--muted); font-size: clamp(12px, .8vw, 15px); font-weight: 700; }
    @media (max-width: 1200px) {
      .option-a .tray-grid,
      .option-b .tray-grid,
      .option-c .tray-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-height: 820px) {
      .topbar { min-height: 64px; padding: 8px 12px; }
      .metric { min-height: 86px; }
      .screen { padding: 12px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
  </style>
</head>
<body>
  <main class="preview">
    <header class="topbar">
      <div>
        <div class="kicker">MES WORKBENCH · LAYOUT PREVIEW</div>
        <h1>暂存间 / 外观检测间 · 托盘总览</h1>
      </div>
      <div class="switches" aria-label="预览切换">
        <button class="switch is-active" data-room="staging" type="button">暂存间</button>
        <button class="switch" data-room="appearance" type="button">外观检测间</button>
        <button class="switch is-active" data-option="a" type="button">方案 A</button>
        <button class="switch" data-option="b" type="button">方案 B</button>
        <button class="switch" data-option="c" type="button">方案 C</button>
      </div>
    </header>

    <section class="screen" aria-live="polite">
      <div class="screen-head">
        <div>
          <div class="kicker" data-room-kicker>STAGING BUFFER</div>
          <p data-room-description>仅展示当前在库托盘的核心识别信息，适配 1920×1080 / 100% 缩放。</p>
        </div>
        <div class="resolution">1920 × 1080 · 100%</div>
      </div>

      <div class="metric">
        <div class="metric-label" data-metric-label>暂存间中托盘数量</div>
        <div class="metric-value" data-metric-value>5</div>
        <div class="metric-unit">盘</div>
        <div class="metric-note" data-metric-note>当前页面最多展示 5 个托盘</div>
      </div>

      <div class="tray-area">
        <div class="tray-grid option-a" data-tray-grid></div>
      </div>

      <div class="actionbar" aria-label="扫码操作">
        <button class="action action--in" type="button">扫码入库</button>
        <button class="action action--out" type="button">扫码出库</button>
      </div>
      <div class="scheme-note" data-scheme-note>方案 A · 单列横向卡片：识别码最大化，适合远距离读取。</div>
    </section>
  </main>

  <script>
    const rooms = {
      staging: {
        kicker: "STAGING BUFFER",
        label: "暂存间中托盘数量",
        description: "仅展示当前在库托盘的核心识别信息，适配 1920×1080 / 100% 缩放。",
      },
      appearance: {
        kicker: "APPEARANCE CHECK",
        label: "外观检测间中托盘数量",
        description: "外观检测间采用同一信息层级，托盘与任务编号保持居中放大。",
      },
    };
    const schemes = {
      a: "方案 A · 单列横向卡片：识别码最大化，适合远距离读取。",
      b: "方案 B · 2+3 网格：信息均衡，适合快速扫视五个托盘。",
      c: "方案 C · 五列大卡片：托盘并列展示，适合操作台正面大屏。",
    };
    const trays = [
      ["SYLU-2026-06-026-TP-001", "SYLU-2026-06-026", 12],
      ["SYLU-2026-06-026-TP-002", "SYLU-2026-06-026", 10],
      ["SYLU-2026-06-027-TP-001", "SYLU-2026-06-027", 8],
      ["SYLU-2026-06-028-TP-001", "SYLU-2026-06-028", 15],
      ["SYLU-2026-06-029-TP-001", "SYLU-2026-06-029", 6],
    ];
    const grid = document.querySelector("[data-tray-grid]");
    const render = () => {
      grid.innerHTML = trays.slice(0, 5).map(([tray, task, quantity]) => `
        <article class="tray-card" aria-label="${tray}">
          <div class="tray-card__field"><strong>${tray}</strong></div>
          <div class="tray-card__field tray-card__task"><strong>${task}</strong></div>
          <div class="tray-card__field tray-card__qty"><strong>${quantity}</strong></div>
        </article>
      `).join("");
    };
    const setRoom = (room) => {
      const copy = rooms[room];
      document.querySelectorAll("[data-room]").forEach((button) => button.classList.toggle("is-active", button.dataset.room === room));
      document.querySelector("[data-room-kicker]").textContent = copy.kicker;
      document.querySelector("[data-room-description]").textContent = copy.description;
      document.querySelector("[data-metric-label]").textContent = copy.label;
    };
    const setOption = (option) => {
      document.querySelectorAll("[data-option]").forEach((button) => button.classList.toggle("is-active", button.dataset.option === option));
      grid.className = `tray-grid option-${option}`;
      document.querySelector("[data-scheme-note]").textContent = schemes[option];
    };
    document.querySelectorAll("[data-room]").forEach((button) => button.addEventListener("click", () => setRoom(button.dataset.room)));
    document.querySelectorAll("[data-option]").forEach((button) => button.addEventListener("click", () => setOption(button.dataset.option)));
    render();
  </script>
</body>
</html>
